name: Publish

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One publication at a time, none cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the data branch.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run flf ingest
      - run: uv run flf backtest
      - run: uv run flf backtest --config config/peak.toml
      - run: uv run flf publish --out bundle
      - run: uv run flf snapshot bundle/realtime.parquet
      - run: scripts/archive.sh bundle

  # The page reads the bundles of the data branch, so it is built after each publication.
  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run data
      - run: npm run build
        env:
          # The question box appears once the API is deployed and its address set on the
          # repository.
          VITE_API_URL: ${{ vars.API_URL }}
      # An artifact per attempt: a job run again deploys its own instead of finding two.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
