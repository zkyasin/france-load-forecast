name: Deploy

# Builds the image of the question API and deploys it to Cloud Run. It runs once the Google Cloud
# project is set up with scripts/cloud-setup.sh and its variables are set on the repository.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - config/agent.toml
      - config/api.toml
      - config/facts.toml
      - src/france_load_forecast/__init__.py
      - src/france_load_forecast/api.py
      - src/france_load_forecast/bundle.py
      - src/france_load_forecast/agent/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: cloud-run
      url: ${{ steps.deploy.outputs.url }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      RUN_ACCOUNT: ${{ vars.GCP_RUN_SERVICE_ACCOUNT }}
      REGION: europe-west9
      IMAGE: europe-west9-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/api/questions:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build --tag "$IMAGE" . && docker push "$IMAGE"
      # One instance at most, and none when idle: the free tier covers the expected use, and the
      # budget of the project caps what it does not.
      - id: deploy
        run: |
          gcloud run deploy questions --quiet --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE" --service-account "$RUN_ACCOUNT" \
            --set-secrets GROQ_API_KEY=groq-api-key:latest --allow-unauthenticated \
            --min-instances 0 --max-instances 1 --cpu 1 --memory 512Mi \
            --concurrency 10 --timeout 60
          url=$(gcloud run services describe questions --project "$PROJECT" --region "$REGION" \
            --format 'value(status.url)')
          echo "url=$url" >>"$GITHUB_OUTPUT"
      - run: curl --fail --silent "${{ steps.deploy.outputs.url }}/health"
