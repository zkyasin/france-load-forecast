[[questions]]
id = "scenario-mild-2028"
category = "scenario"
text = "Quelle consommation en 2028 avec un hiver doux ?"
tool = "scenario"
arguments = { year = 2028, winter = "mild" }
figures = ["annual_energy", "reference.annual_energy"]
