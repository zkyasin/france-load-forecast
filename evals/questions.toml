tool = "month_gap"
arguments = { month = "2026-09" }
figures = ["gap.vs_forecast"]
answer = """
0,23 TWh sous la prévision, surtout par le résidu et le terme structurel. Ces chiffres sont \
provisoires : septembre repose encore sur des données en temps réel."""

[[questions]]
id = "gap-july-weather-share"
category = "gap"
text = "Quelle part de la hausse de juillet 2026 par rapport à juillet 2025 vient de la météo ?"
tool = "month_gap"
arguments = { month = "2026-07" }
figures = ["gap.vs_year_before", "terms.climate.vs_year_before"]
answer = "Sur +1,5 TWh de hausse, +1,1 TWh viennent du climat, plus chaud qu'en juillet 2025."

[[questions]]
id = "gap-follow-up-year-before"
category = "gap"
text = "Et par rapport à avril 2025 ?"
tool = "month_gap"
arguments = { month = "2026-04" }
figures = ["gap.vs_year_before"]
previous = { question = "Pourquoi la consommation d'avril 2026 a-t-elle été plus basse que prévu ?", answer = "Avril 2026 a fini 2,58 TWh sous la prévision faite au début du mois, surtout parce qu'il a fait plus doux que prévu." }
answer = "Avril 2026 a consommé 0,26 TWh de plus qu'avril 2025, avec un climat presque identique."

[[questions]]
id = "history-rte-2024"
category = "history"
text = "La consommation de 2024 que vous calculez est-elle la même que celle publiée par RTE ?"
tool = "annual_energy"
arguments = { first = 2024, last = 2024 }
figures = ["gross", "gross_rte"]
answer = """
Presque : 440,1 TWh contre 442,3 TWh chez RTE, 0,5 % de moins, car la série de RTE compte aussi \
