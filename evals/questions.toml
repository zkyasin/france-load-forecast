[[questions]]
id = "history-2022-corrected"
category = "history"
text = "Quelle a été la consommation corrigée du climat en 2022 ?"
tool = "annual_energy"
arguments = { first = 2022, last = 2022 }
figures = ["corrected"]
answer = "449,3 TWh corrigés du climat, 10,7 TWh de moins qu'en 2021."

[[questions]]
id = "model-accuracy-one-month"
