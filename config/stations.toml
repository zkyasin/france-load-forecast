# Météo-France stations that rebuild the national temperature before RTE's series starts in 2012,
# see src/france_load_forecast/stations.py. In each department of a large city, the station with
# the most days of (TN + TX) / 2 since 1950, kept if it has every day from 1950 to 2024: Tours,
# Monestier, Sommesous and Le Palais-sur-Vienne miss days and are left out.

# Period of Météo-France's daily files, as their names give it.
period = "1950-2024"
first_day = 1950-01-01

# Years RTE's temperature and the stations both cover: the weights are fitted on them.
fit_from = 2012
fit_until = 2024

