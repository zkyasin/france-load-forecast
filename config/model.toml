# Daily load model, see src/france_load_forecast/model.py.

# Weight of the current day in the exponentially smoothed temperature. 0.5 maximises the
# likelihood of the model fitted on 2012-2026, on a grid from 0.3 to 0.6 in steps of 0.05.
smoothing = 0.5

# Each component is a group of terms, written as a patsy formula. Decompositions report one
# contribution per component, so a new driver is added here as a new component.
[components]
# The climate terms are a function of `temperature_smooth` only: climate correction replaces it
# with the smoothed reference temperature.
climate = "cr(temperature_smooth, df=6, constraints='center', lower_bound=-15, upper_bound=35)"
calendar = "C(day_type, Treatment('wed')) + bridge + christmas + august + sin1 + cos1 + sin2 + cos2"
lockdown = "lockdown_1 + lockdown_2 + lockdown_3"
